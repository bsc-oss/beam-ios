name: IntegrationTests

schemes:
  IntegrationTests:
    analyze:
      config: Debug-dev
    archive:
      config: Release-dev
    build:
      targets:
        IntegrationTests: all
    profile:
      config: Release-dev
    run:
      config: Debug-dev
      disableMainThreadChecker: false
    test:
      config: Debug-dev
      disableMainThreadChecker: false
      gatherCoverageData: true
      coverageTargets:
        - ElementX
      testPlans:
        - path: IntegrationTests.xctestplan
          defaultPlan: true

targets:
  IntegrationTests:
    type: bundle.ui-testing
    platform: iOS

    dependencies:
    - target: ElementX
    - package: MatrixRustSDK
    - package: DeviceKit
    - package: KeychainAccess
    - package: Kingfisher
    - package: SwiftState
    - package: GZIP
    - package: Sentry
    - package: Collections

    info:
      path: ../SupportingFiles/Info.plist

    settings:
      base:
        PRODUCT_NAME: IntegrationTests
        PRODUCT_BUNDLE_IDENTIFIER: ${BASE_BUNDLE_IDENTIFIER}.integration.tests
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      debug:
      release:

    sources:
    - path: ../Sources
    - path: ../SupportingFiles
    - path: ../../ElementX/Sources/Other/AccessibilityIdentifiers.swift
    - path: ../../ElementX/Sources/Other/Extensions/NSRegularExpresion.swift
    - path: ../../ElementX/Sources/Other/Extensions/XCUIElement.swift
    - path: ../../ElementX/Sources/Services/Analytics/Signposter.swift
