name: ElementX

schemes:
  ElementX:
    analyze:
      config: Debug-dev
    archive:
      config: Release-dev
    build:
      targets:
        ElementX:
          - running
          - testing
          - profiling
          - analyzing
          - archiving
    profile:
      config: Release-dev
    run:
      config: Debug-dev
      environmentVariables:
        - variable: HTTPS_PROXY
          value: localhost:9090
          isEnabled: false
        - variable: UI_TESTS_SCREEN
          value: ""
          isEnabled: false
        - variable: RESET_APP_SETTINGS
          value: "true"
          isEnabled: false
    test:
      config: Debug-dev
      gatherCoverageData: true
      coverageTargets:
        - ElementX
      testPlans:
        - path: ../../UnitTests/SupportingFiles/UnitTests.xctestplan
          defaultPlan: true

targets:
  ElementX:
    type: application
    platform: iOS

    info:
      path: Info.plist
      properties:
        UILaunchScreen:
          UIColorName: colors/background-color
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes: [
          {
            CFBundleTypeRole: Editor,
            CFBundleURLName: "Application",
            CFBundleURLSchemes: [
              $(BASE_BUNDLE_IDENTIFIER), # The app's own scheme for custom routes
              "matrix" # Matrix URI scheme for permalinks
            ]
          }
        ]
        UIApplicationSceneManifest: {
          UIApplicationSupportsMultipleScenes: true
        }
        UISupportedInterfaceOrientations: [
          UIInterfaceOrientationPortrait,
          UIInterfaceOrientationPortraitUpsideDown,
          UIInterfaceOrientationLandscapeLeft,
          UIInterfaceOrientationLandscapeRight
        ]
        appGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        baseBundleIdentifier: $(BASE_BUNDLE_IDENTIFIER)
        keychainAccessGroupIdentifier: $(KEYCHAIN_ACCESS_GROUP_IDENTIFIER)
        # PG_CHANGED - removed classicApp* Info.plist properties: classic-app account import disabled for Beam
        productionAppName: $(PRODUCTION_APP_NAME)
        ITSAppUsesNonExemptEncryption: false
        NSUserActivityTypes: [
          INSendMessageIntent,
          INStartCallIntent,
        ]
        NSCameraUsageDescription: To take pictures or videos and send them as a message $(APP_DISPLAY_NAME) needs access to the camera.
        NSMicrophoneUsageDescription: To record and send messages with audio, $(APP_DISPLAY_NAME) needs to access the microphone.
        NSPhotoLibraryAddUsageDescription: This lets you save images and videos to your photo library.
        NSLocationWhenInUseUsageDescription: Grant location access so that $(APP_DISPLAY_NAME) can share your location.
        NSLocationAlwaysAndWhenInUseUsageDescription: To share your live location, $(APP_DISPLAY_NAME) needs location access when the app is in the background.
        NSFaceIDUsageDescription: Face ID is used to access your app.
        # PG_CHANGED - required to pass App Store validation (ITMS-90683): ExpoLocation.xcframework in the Argus brownfield bundle links CMMotionActivityManager. Not requested at runtime (app never calls the motion-activity API).
        NSMotionUsageDescription: $(APP_DISPLAY_NAME) can use your motion activity to improve location-based features.
        UIBackgroundModes: [
          audio,
          fetch,
          processing,
          voip
        ]
        BGTaskSchedulerPermittedIdentifiers: [
          $(BASE_BUNDLE_IDENTIFIER).background.refresh
        ]
        UTExportedTypeDeclarations:
        - UTTypeConformsTo: [public.text]
          UTTypeDescription: Mention Pills
          UTTypeIdentifier: $(PILLS_UT_TYPE_IDENTIFIER)
        CFBundleDocumentTypes:
        - CFBundleTypeName: Mention Pills
          CFBundleTypeRole: Viewer
          LSHandlerRank: Owner
          LSItemContentTypes: $(PILLS_UT_TYPE_IDENTIFIER)
        LSSupportsOpeningDocumentsInPlace: false
        # PG_CHANGED
        appEnvironment: $(APP_ENVIRONMENT)
        pushGatewayBaseURL: $(PUSH_GATEWAY_BASE_URL)
        pgServiceUrl: $(PG_SERVICE_URL)
        pgNoticeUrl: $(PG_NOTICE_URL)
        pgMapTileServerUrl: $(PG_MAP_TILE_SERVER_URL)
        bugReportRageshakeURL: $(BUG_REPORT_RAGESHAKE_URL)
        oidcRedirectURL: $(OIDC_REDIRECT_URL)
        websiteDomain: $(WEBSITE_DOMAIN)

    entitlements:
      path: ElementX.entitlements
      properties:
        aps-environment: $(APS_ENV)
        # PG_CHANGED
        com.apple.developer.associated-domains:
        # PG_CHANGED - use single configurable $(ASSOCIATED_DOMAIN); dropped hardcoded element.io/matrix.to domains
        - webcredentials:$(ASSOCIATED_DOMAIN)
        - applinks:$(ASSOCIATED_DOMAIN)
        com.apple.developer.usernotifications.communication: true
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
        - $(APP_GROUP_IDENTIFIER)
        # PG_CHANGED - removed $(CLASSIC_APP_GROUP_IDENTIFIER): classic-app import disabled for Beam
        com.apple.security.network.client: true
        keychain-access-groups:
        - $(KEYCHAIN_ACCESS_GROUP_IDENTIFIER)
        # PG_CHANGED - removed $(CLASSIC_APP_KEYCHAIN_ACCESS_GROUP_IDENTIFIER): classic-app import disabled for Beam

    settings:
      base:
        PRODUCT_NAME: $(APP_NAME)
        # PG_CHANGED - updated app name - keeps ElementX as module name to avoid changes in codebase
        PRODUCT_MODULE_NAME: $(APP_MODULE_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_IDENTIFIER)
        MARKETING_VERSION: $(MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(CURRENT_PROJECT_VERSION)
        ASSETCATALOG_COMPILER_APPICON_NAME: $(APP_ICON_SET_NAME)
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        SWIFT_OBJC_BRIDGING_HEADER: ElementX/SupportingFiles/ElementX-Bridging-Header.h
        SWIFT_OBJC_INTERFACE_HEADER_NAME: GeneratedInterface-Swift.h
        PILLS_UT_TYPE_IDENTIFIER: $(BASE_BUNDLE_IDENTIFIER).pills
        DEVELOPMENT_ASSET_PATHS: DevelopmentAssets/Media
        OTHER_SWIFT_FLAGS:
        - "-DIS_MAIN_APP"
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

    preBuildScripts:
    - name: 🛠 SwiftGen
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        export PATH="$PATH:/opt/homebrew/bin"
        if which swiftgen >/dev/null; then
            swiftgen config run --config Tools/SwiftGen/swiftgen-config.yml
        else
            echo "warning: SwiftGen not installed, download from https://github.com/SwiftGen/SwiftGen"
        fi
    - name: 🧙 Sourcery - Generate mocks
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        export PATH="$PATH:/opt/homebrew/bin"
        if which sourcery >/dev/null; then
            sourcery --config Tools/Sourcery/AutoMockableConfig.yml
        else
            echo "warning: Sourcery not installed, run swift run tools setup-project"
        fi

    - name: 🧙 Sourcery - Generate preview tests
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        export PATH="$PATH:/opt/homebrew/bin"
        if which sourcery >/dev/null; then
            sourcery --config Tools/Sourcery/PreviewTestsConfig.yml
        else
            echo "warning: Sourcery not installed, run swift run tools setup-project"
        fi
        
    - name: 🧙 Sourcery - Generate Accessibility Tests
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        export PATH="$PATH:/opt/homebrew/bin"
        if which sourcery >/dev/null; then
            sourcery --config Tools/Sourcery/TestablePreviewsDictionary.yml
            sourcery --config Tools/Sourcery/AccessibilityTests.yml
        else
            echo "warning: Sourcery not installed, run swift run tools setup-project"
        fi

    postBuildScripts:
    - name: ⚠️ SwiftLint
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        export PATH="$PATH:/opt/homebrew/bin"
        if which swiftlint >/dev/null; then
            swiftlint
        else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
        fi
    - name: 🧹 SwiftFormat
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        export PATH="$PATH:/opt/homebrew/bin"
        if which swiftformat >/dev/null; then
            swiftformat --lint --lenient "$PROJECT_DIR"
        else
            echo "warning: SwiftFormat not installed, download from https://github.com/nicklockwood/SwiftFormat"
        fi
    # PG_CHANGED - strip Settings.bundle locales (keep: en, fr, de, nl)
    - name: 🗑 Strip Settings.bundle locales
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        SETTINGS_BUNDLE="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Settings.bundle"
        if [ -d "$SETTINGS_BUNDLE" ]; then
          find "$SETTINGS_BUNDLE" -maxdepth 1 -type d -name "*.lproj" \
            ! -name "en.lproj" ! -name "fr.lproj" ! -name "de.lproj" ! -name "nl.lproj" \
            -prune -exec rm -r {} \;
        fi

    dependencies:
    - target: NSE
    - target: ShareExtension
    - target: MatrixRustSDKMocks
    - package: MatrixRustSDK
      embed: true
    # PG_CHANGED - integrates Expo Brownfield. Single Swift Package that bundles
    # every RN/Expo xcframework; Xcode links and embeds all of them automatically.
    - package: PGArgusMobileBrownfield
      product: PGArgusMobileBrownfieldArtifacts
    - package: Compound
    - package: Algorithms
    - package: AsyncAlgorithms
    - package: AnalyticsEvents
    - package: Collections
    - package: DeviceKit
    - package: EmbeddedElementCall
    - package: KeychainAccess
    - package: Kingfisher
    - package: KZFileWatchers
    - package: LoremSwiftum
    - package: LRUCache
    - package: Mantis
    - package: MapLibre
    - package: PostHog
    - package: SwiftState
    - package: GZIP
    - package: Sentry
      products: 
        - Sentry
        - SentrySwiftUI
    - package: Version
    - package: Emojibase
    - package: WysiwygComposer
    - package: SwiftOGG
    - package: SwiftSoup
    - package: SwiftFlow
      product: Flow
    - package: DSWaveformImage
      product: DSWaveformImageViews

    sources:
    - path: ../Sources
      excludes:
        - Other/Extensions/XCTestCase.swift
        - Other/Extensions/XCUIElement.swift
    - path: ../../Secrets/Secrets.swift
    - path: ../Resources
      excludes:
        # PG_CHANGED - exclude all languages except en, fr, de, nl
        - Localizations/be.lproj/**
        - Localizations/bg.lproj/**
        - Localizations/cs.lproj/**
        - Localizations/cy.lproj/**
        - Localizations/da.lproj/**
        - Localizations/el.lproj/**
        - Localizations/en-US.lproj/**
        - Localizations/es.lproj/**
        - Localizations/et.lproj/**
        - Localizations/eu.lproj/**
        - Localizations/fa.lproj/**
        - Localizations/fi.lproj/**
        - Localizations/hr.lproj/**
        - Localizations/hu.lproj/**
        - Localizations/id.lproj/**
        - Localizations/it.lproj/**
        - Localizations/ka.lproj/**
        - Localizations/ko.lproj/**
        - Localizations/lt.lproj/**
        - Localizations/nb.lproj/**
        - Localizations/pl.lproj/**
        - Localizations/pt-BR.lproj/**
        - Localizations/pt.lproj/**
        - Localizations/ro.lproj/**
        - Localizations/ru.lproj/**
        - Localizations/sk.lproj/**
        - Localizations/sv.lproj/**
        - Localizations/tr.lproj/**
        - Localizations/uk.lproj/**
        - Localizations/ur.lproj/**
        - Localizations/uz.lproj/**
        - Localizations/zh-Hans.lproj/**
        - Localizations/zh-Hant-TW.lproj/**
    - path: ../SupportingFiles
    - path: ../../Tools/Scripts/Templates/SimpleScreenExample/ElementX
    - path: ../../DevelopmentAssets/Media
    
    # This is required for testing purposes... The problem with unit tests is that if you
    # try to `@testable import NSE` you can only get the definition of files, but due to a
    # limitation in how they work, they can only compile files that are part of the main test
    # target, so linking will fail. The solution is to just have the main app to reference the
    # extension code, and test it directly.
    - path: ../../NSE/Sources
