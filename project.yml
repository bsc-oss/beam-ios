name: ElementX
attributes:
  # PG_CHANGED - updated organization name
  ORGANIZATIONNAME: Belgian Secure Communications (BSC)
  LastUpgradeCheck: "1620"
fileGroups:
- project.yml
- env/dev.yml
- env/tst.yml
- env/acc.yml
- env/prd.yml

options:
  groupSortPosition: bottom
  createIntermediateGroups: true
  deploymentTarget:
    iOS: '18.5'
  groupOrdering:
  - order:
    - ElementX
    - NSE
    - ShareExtension
    - UnitTests
    - PreviewTests
    - UITests
    - AccessibilityTests
    - IntegrationTests
    - DevelopmentAssets
    - SDKMocks
    - Secrets
    - Tools
  - pattern: ElementX
    order:
    - Sources
    - Resources
    - SupportingFiles
  - pattern: Sources
    order:
    - Application
    - UserSession
    - Services
    - FlowCoordinators
    - Screens
    - Other
    - UITests
    - AccessibilityTests
  fileTypes:
    icon:
      file: true # https://github.com/yonaskolb/XcodeGen/issues/1556
  postGenCommand: cd Tools/XcodeGen && sh postGenCommand.sh

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 5BQPPCKLYR
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: true
    ENABLE_BITCODE: false
    # PG_CHANGED - updated app name
    APP_NAME: Beam
    # PG_CHANGED - updated app name - keeps ElementX as module name to avoid changes in codebase
    APP_MODULE_NAME: ElementX
    KEYCHAIN_ACCESS_GROUP_IDENTIFIER: "$(DEVELOPMENT_TEAM).$(BASE_BUNDLE_IDENTIFIER)"
    MARKETING_VERSION: 1.0.4
    CURRENT_PROJECT_VERSION: 1
    SUPPORTS_MACCATALYST: false
    # PG_CHANGED - targeted device family set to iPhone only
    TARGETED_DEVICE_FAMILY: 1
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

include:
- path: ElementX/SupportingFiles/target.yml
- path: NSE/SupportingFiles/target.yml
- path: ShareExtension/SupportingFiles/target.yml
- path: SDKMocks/SupportingFiles/target.yml
- path: UnitTests/SupportingFiles/target.yml
- path: PreviewTests/SupportingFiles/target.yml
- path: UITests/SupportingFiles/target.yml
- path: IntegrationTests/SupportingFiles/target.yml
- path: AccessibilityTests/SupportingFiles/target.yml
# - path: MyAppVariant/override.yml
# PG_CHANGED - build variant per environment
- path: env/dev.yml
- path: env/tst.yml
- path: env/acc.yml
- path: env/prd.yml

# PG_CHANGED - build variant per environment
configs:
  Debug-dev: debug
  Release-dev: release
  Debug-tst: debug
  Release-tst: release
  Debug-acc: debug
  Release-acc: release
  Debug-prd: debug
  Release-prd: release

packages:
  # Element/Matrix dependencies
  # PG_CHANGED
  MatrixRustSDK:
    url: git@private-registry:general/pg/rust-sdk/pg-rust-components-swift.git
    exactVersion: 0.0.30
    # path: ../rust-sdk/pg-rust-sdk
  # PG_CHANGED
  Compound:
    path: compound-ios
  # PG_CHANGED - Expo Brownfield artifacts. Single local Swift Package bundling
  # every RN/Expo xcframework (built by `npm run brownfield:ios:debug` (or `:release`) in
  # pg-argus-mobile and copied into Frameworks/ by copy-ios-package).
  PGArgusMobileBrownfield:
    path: Frameworks/PGArgusMobileBrownfieldArtifacts
  AnalyticsEvents:
    url: https://github.com/matrix-org/matrix-analytics-events
    minorVersion: 0.33.2
    # path: ../matrix-analytics-events
  # PG_CHANGED
  EmbeddedElementCall:
    url: git@private-registry:general/pg/pg-call-swift.git
    exactVersion: 0.0.13
    # path: ../pg-call/embedded/ios
  Emojibase:
    url: https://github.com/matrix-org/emojibase-bindings
    revision: 60bc01f2e3b31445dc723f5af1a777b63d18e6c2
    # path: ../emojibase-bindings
  SwiftOGG:
    url: https://github.com/element-hq/swift-ogg
    minorVersion: 0.0.3
    # path: ../swift-ogg
  WysiwygComposer:
    url: https://github.com/element-hq/matrix-rich-text-editor-swift
    exactVersion: 2.41.3
    # path: ../matrix-rich-text-editor/platforms/ios/lib/WysiwygComposer
  
  # External dependencies
  Algorithms:
    url: https://github.com/apple/swift-algorithms
    minorVersion: 1.2.1
  AsyncAlgorithms:
    url: https://github.com/apple/swift-async-algorithms
    minorVersion: 1.1.3
  Clocks:
    url: https://github.com/pointfreeco/swift-clocks
    from: 1.0.6
  Collections:
    url: https://github.com/apple/swift-collections
    minorVersion: 1.4.1
  DeviceKit:
    url: https://github.com/devicekit/DeviceKit
    minorVersion: 5.8.0
  DSWaveformImage:
    url: https://github.com/dmrschmidt/DSWaveformImage
    exactVersion: 14.3.0
  Dynamic:
    url: https://github.com/mhdhejazi/Dynamic
    exactVersion: 1.2
  GZIP:
    url: https://github.com/nicklockwood/GZIP
    minorVersion: 1.3.2
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    minorVersion: 4.2.2
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    minorVersion: 8.8.1
  KZFileWatchers:
    url: https://github.com/krzysztofzablocki/KZFileWatchers
    minorVersion: 1.2.0
  LoremSwiftum:
    url: https://github.com/lukaskubanek/LoremSwiftum
    minorVersion: 2.2.3
  LRUCache:
    url: https://github.com/nicklockwood/LRUCache
    minorVersion: 1.2.1
  Mantis:
    url: https://github.com/guoyingtao/Mantis
    minorVersion: 2.31.1
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    minorVersion: 6.26.0
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    minorVersion: 3.57.2
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    minorVersion: 9.11.0
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    minorVersion: 1.19.2
  SwiftFlow:
    url: https://github.com/tevelee/SwiftUI-Flow.git
    minorVersion: 3.1.1
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    minorVersion: 2.13.4
  SwiftState:
    url: https://github.com/ReactKit/SwiftState
    minorVersion: 6.0.1
  Version:
    url: https://github.com/mxcl/Version
    minorVersion: 2.2.0

aggregateTargets:
  Periphery:
    buildScripts:
    - name: Scan
      script: |
        export PATH="$PATH:/opt/homebrew/bin"
        periphery scan --format xcode
      basedOnDependencyAnalysis: false
